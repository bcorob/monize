services:
  backend:
    environment:
      PUBLIC_APP_URL: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN to the HTTPS hostname}
      CORS_ORIGIN: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN to the HTTPS hostname}
      DISABLE_HTTPS_HEADERS: "false"

  frontend:
    ports: !reset []
    environment:
      PUBLIC_APP_URL: https://${CADDY_DOMAIN:?Set CADDY_DOMAIN to the HTTPS hostname}
      DISABLE_HTTPS_HEADERS: "false"
      TRUSTED_PROXY_HOPS: "1"
      CLIENT_IP_HEADER: ""

  caddy:
    build:
      context: ./deploy/caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN to the HTTPS hostname}
      CADDY_ROUTE53_HOSTED_ZONE_ID: ${CADDY_ROUTE53_HOSTED_ZONE_ID:?Set the public Route 53 hosted zone ID}
      AWS_ACCESS_KEY_ID: ${CADDY_AWS_ACCESS_KEY_ID:?Set a dedicated Route 53 access key}
      AWS_SECRET_ACCESS_KEY: ${CADDY_AWS_SECRET_ACCESS_KEY:?Set the Route 53 secret access key}
      AWS_SESSION_TOKEN: ${CADDY_AWS_SESSION_TOKEN:-}
      AWS_REGION: ${CADDY_AWS_REGION:-us-east-1}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - monize-network

volumes:
  caddy_data:
  caddy_config:
